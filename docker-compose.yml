services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
      - VITE_WS_URL=ws://localhost:3001
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      # Override for Docker networking — Unsloth runs on the HOST, not in Docker
      - UNSLOTH_URL=http://host.docker.internal:8888
      # Obsidian vault is mounted at /obsidian inside the container
      - OBSIDIAN_VAULT_PATH=/obsidian/Sonic Scribe
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
      - /Users/bill/Syrcuse:/obsidian
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
